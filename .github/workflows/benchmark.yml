name: Performance and memory baseline

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install DevDoctor
        run: python -m pip install -e ".[dev]"
      - name: Measure latency and peak RSS
        run: |
          # Aggregate RSS sums every probe child alive at once (4 workers by
          # default); self RSS is DevDoctor's own process and keeps the old bar.
          python scripts/benchmark.py \
            --iterations 5 \
            --max-startup-rss-mib 128 \
            --max-scan-rss-mib 256 \
            --max-scan-self-rss-mib 128 \
            --output benchmark.json
      - name: Upload performance and memory baseline
        uses: actions/upload-artifact@v7
        with:
          name: devdoctor-performance-baseline
          path: benchmark.json
          if-no-files-found: error
